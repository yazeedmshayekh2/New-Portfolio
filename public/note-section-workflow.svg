<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <!-- Background -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#080c18"/>
      <stop offset="60%" style="stop-color:#0a0e1a"/>
      <stop offset="100%" style="stop-color:#0c1420"/>
    </linearGradient>

    <!-- asyncio node glow -->
    <radialGradient id="asyncioGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   style="stop-color:#00d4ff;stop-opacity:0.22"/>
      <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:0"/>
    </radialGradient>

    <!-- aiohttp node glow -->
    <radialGradient id="aiohttpGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   style="stop-color:#00ffaa;stop-opacity:0.22"/>
      <stop offset="100%" style="stop-color:#00ffaa;stop-opacity:0"/>
    </radialGradient>

    <!-- Title gradients -->
    <linearGradient id="titleCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#38bdf8"/>
    </linearGradient>
    <linearGradient id="titleGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00ffaa"/>
      <stop offset="100%" style="stop-color:#34d399"/>
    </linearGradient>

    <!-- Dot grid -->
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.2" fill="#1e3a5f" opacity="0.5"/>
    </pattern>

    <!-- Glow filters -->
    <filter id="fgCyan" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="fgGreen" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="titleGlow" x="-15%" y="-30%" width="130%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ══ BACKGROUND ══ -->
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#dots)"/>

  <!-- Ambient blobs -->
  <ellipse cx="380" cy="450" rx="380" ry="320" fill="url(#asyncioGlow)"/>
  <ellipse cx="1220" cy="450" rx="380" ry="320" fill="url(#aiohttpGlow)"/>

  <!-- Corner brackets -->
  <path d="M 44 44 L 44 94 M 44 44 L 94 44" stroke="#1e3a5f" stroke-width="2.5" fill="none"/>
  <path d="M 1556 44 L 1506 44 M 1556 44 L 1556 94" stroke="#1e3a5f" stroke-width="2.5" fill="none"/>
  <path d="M 44 856 L 44 806 M 44 856 L 94 856" stroke="#1e3a5f" stroke-width="2.5" fill="none"/>
  <path d="M 1556 856 L 1506 856 M 1556 856 L 1556 806" stroke="#1e3a5f" stroke-width="2.5" fill="none"/>

  <!-- ══════════════════════════════════════════════════════ -->
  <!--                  TITLE BAR                            -->
  <!-- ══════════════════════════════════════════════════════ -->
  <rect x="440" y="30" width="720" height="90" rx="18" fill="#060a14" opacity="0.88"/>
  <rect x="440" y="30" width="720" height="90" rx="18" fill="none" stroke="#1e3a5f" stroke-width="1.8"/>

  <text x="560" y="100" font-family="'Courier New', monospace" font-size="50" font-weight="900"
        fill="url(#titleCyan)" filter="url(#titleGlow)">asyncio</text>
  <text x="800" y="100" font-family="'Courier New', monospace" font-size="30" font-weight="300"
        fill="#ffffff" text-anchor="middle" opacity="0.35">vs</text>
  <text x="870" y="100" font-family="'Courier New', monospace" font-size="50" font-weight="900"
        fill="url(#titleGreen)" filter="url(#titleGlow)">aiohttp</text>

  <text x="800" y="116" font-family="'Courier New', monospace" font-size="13"
        fill="#ffffff" text-anchor="middle" letter-spacing="4" opacity="0.28">PYTHON ASYNC ECOSYSTEM</text>

  <!-- ══════════════════════════════════════════════════════ -->
  <!--              asyncio NODE (LEFT)                      -->
  <!-- ══════════════════════════════════════════════════════ -->

  <!-- Outer ring glow -->
  <circle cx="360" cy="420" r="210" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.12"/>
  <circle cx="360" cy="420" r="175" fill="none" stroke="#00d4ff" stroke-width="1.5" opacity="0.2" stroke-dasharray="8,6"/>
  <!-- Main circle -->
  <circle cx="360" cy="420" r="145" fill="#060e1c" stroke="#00d4ff" stroke-width="2.5"
          opacity="0.95" filter="url(#fgCyan)"/>
  <circle cx="360" cy="420" r="145" fill="none" stroke="#00d4ff" stroke-width="2.5" opacity="0.9"/>

  <!-- asyncio label inside -->
  <text x="360" y="400" font-family="'Courier New', monospace" font-size="32" font-weight="900"
        fill="#00d4ff" text-anchor="middle" filter="url(#softGlow)">asyncio</text>
  <text x="360" y="428" font-family="'Courier New', monospace" font-size="12"
        fill="#ffffff" text-anchor="middle" opacity="0.32" letter-spacing="3">THE ENGINE</text>

  <!-- Divider inside circle -->
  <line x1="270" y1="440" x2="450" y2="440" stroke="#00d4ff" stroke-width="0.8" opacity="0.3"/>

  <!-- Feature list inside -->
  <text x="360" y="462" font-family="'Courier New', monospace" font-size="12"
        fill="#00d4ff" text-anchor="middle" opacity="0.75">Event Loop</text>
  <text x="360" y="480" font-family="'Courier New', monospace" font-size="12"
        fill="#00d4ff" text-anchor="middle" opacity="0.75">gather() · sleep()</text>
  <text x="360" y="498" font-family="'Courier New', monospace" font-size="12"
        fill="#00d4ff" text-anchor="middle" opacity="0.75">Semaphore · Lock</text>
  <text x="360" y="516" font-family="'Courier New', monospace" font-size="12"
        fill="#00d4ff" text-anchor="middle" opacity="0.75">Task Management</text>
  <text x="360" y="534" font-family="'Courier New', monospace" font-size="12"
        fill="#00d4ff" text-anchor="middle" opacity="0.75">run_in_executor()</text>

  <!-- Python built-in badge -->
  <rect x="270" y="554" width="180" height="24" rx="5" fill="#00d4ff" opacity="0.15"/>
  <rect x="270" y="554" width="180" height="24" rx="5" fill="none" stroke="#00d4ff" stroke-width="1.2" opacity="0.5"/>
  <text x="360" y="571" font-family="'Courier New', monospace" font-size="11"
        fill="#00d4ff" text-anchor="middle" opacity="0.8" font-weight="700">✦ BUILT-IN  (stdlib)</text>

  <!-- ══════════════════════════════════════════════════════ -->
  <!--              aiohttp NODE (RIGHT)                     -->
  <!-- ══════════════════════════════════════════════════════ -->

  <!-- Outer ring glow -->
  <circle cx="1240" cy="420" r="210" fill="none" stroke="#00ffaa" stroke-width="1" opacity="0.12"/>
  <circle cx="1240" cy="420" r="175" fill="none" stroke="#00ffaa" stroke-width="1.5" opacity="0.2" stroke-dasharray="8,6"/>
  <!-- Main circle -->
  <circle cx="1240" cy="420" r="145" fill="#060e1c" stroke="#00ffaa" stroke-width="2.5"
          opacity="0.95" filter="url(#fgGreen)"/>
  <circle cx="1240" cy="420" r="145" fill="none" stroke="#00ffaa" stroke-width="2.5" opacity="0.9"/>

  <!-- aiohttp label inside -->
  <text x="1240" y="400" font-family="'Courier New', monospace" font-size="32" font-weight="900"
        fill="#00ffaa" text-anchor="middle" filter="url(#softGlow)">aiohttp</text>
  <text x="1240" y="428" font-family="'Courier New', monospace" font-size="12"
        fill="#ffffff" text-anchor="middle" opacity="0.32" letter-spacing="3">THE APPLICATION</text>

  <!-- Divider inside circle -->
  <line x1="1150" y1="440" x2="1330" y2="440" stroke="#00ffaa" stroke-width="0.8" opacity="0.3"/>

  <!-- Feature list inside -->
  <text x="1240" y="462" font-family="'Courier New', monospace" font-size="12"
        fill="#00ffaa" text-anchor="middle" opacity="0.75">HTTP Client</text>
  <text x="1240" y="480" font-family="'Courier New', monospace" font-size="12"
        fill="#00ffaa" text-anchor="middle" opacity="0.75">ClientSession</text>
  <text x="1240" y="498" font-family="'Courier New', monospace" font-size="12"
        fill="#00ffaa" text-anchor="middle" opacity="0.75">TCPConnector</text>
  <text x="1240" y="516" font-family="'Courier New', monospace" font-size="12"
        fill="#00ffaa" text-anchor="middle" opacity="0.75">Timeouts · Cookies</text>
  <text x="1240" y="534" font-family="'Courier New', monospace" font-size="12"
        fill="#00ffaa" text-anchor="middle" opacity="0.75">Async Web Server</text>

  <!-- Third-party badge -->
  <rect x="1150" y="554" width="180" height="24" rx="5" fill="#00ffaa" opacity="0.15"/>
  <rect x="1150" y="554" width="180" height="24" rx="5" fill="none" stroke="#00ffaa" stroke-width="1.2" opacity="0.5"/>
  <text x="1240" y="571" font-family="'Courier New', monospace" font-size="11"
        fill="#00ffaa" text-anchor="middle" opacity="0.8" font-weight="700">✦ THIRD-PARTY  (pip)</text>

  <!-- ══════════════════════════════════════════════════════ -->
  <!--              CENTER CONNECTOR                         -->
  <!-- ══════════════════════════════════════════════════════ -->

  <!-- Horizontal connector line -->
  <line x1="505" y1="420" x2="695" y2="420" stroke="#1e3a5f" stroke-width="1.5" stroke-dasharray="6,5"/>
  <line x1="905" y1="420" x2="1095" y2="420" stroke="#1e3a5f" stroke-width="1.5" stroke-dasharray="6,5"/>

  <!-- Center diamond node -->
  <polygon points="800,380 840,420 800,460 760,420"
           fill="#0a0e1a" stroke="#7b61ff" stroke-width="2" opacity="0.95" filter="url(#softGlow)"/>
  <polygon points="800,380 840,420 800,460 760,420"
           fill="none" stroke="#7b61ff" stroke-width="2" opacity="0.9"/>

  <!-- Arrow from aiohttp down to asyncio (dependency) -->
  <!-- Downward arc from right to left side -->
  <path d="M 1095 430 Q 800 520 705 430"
        fill="none" stroke="#7b61ff" stroke-width="1.8" stroke-dasharray="7,5" opacity="0.55"
        marker-end="url(#arrowPurple)"/>

  <defs>
    <marker id="arrowPurple" markerWidth="10" markerHeight="7"
            refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7b61ff" opacity="0.8"/>
    </marker>
    <marker id="arrowCyan" markerWidth="10" markerHeight="7"
            refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#00d4ff" opacity="0.8"/>
    </marker>
  </defs>

  <!-- "BUILT ON TOP OF" label on the arc -->
  <text x="800" y="530" font-family="'Courier New', monospace" font-size="12"
        fill="#7b61ff" text-anchor="middle" opacity="0.75" letter-spacing="2">aiohttp  BUILT ON TOP OF  asyncio</text>

  <!-- Center diamond text -->
  <text x="800" y="415" font-family="'Courier New', monospace" font-size="10"
        fill="#7b61ff" text-anchor="middle" opacity="0.9" font-weight="700">deps</text>
  <text x="800" y="430" font-family="'Courier New', monospace" font-size="10"
        fill="#7b61ff" text-anchor="middle" opacity="0.9">▼</text>

  <!-- ══════════════════════════════════════════════════════ -->
  <!--              CODE SNIPPETS (BOTTOM)                   -->
  <!-- ══════════════════════════════════════════════════════ -->

  <!-- LEFT code box — asyncio -->
  <rect x="60" y="640" width="700" height="200" rx="12" fill="#060a14" opacity="0.88"/>
  <rect x="60" y="640" width="700" height="200" rx="12" fill="none" stroke="#00d4ff" stroke-width="1.5" opacity="0.4"/>

  <!-- Tab label -->
  <rect x="60" y="640" width="130" height="30" rx="8" fill="#00d4ff" opacity="0.18"/>
  <text x="125" y="660" font-family="'Courier New', monospace" font-size="12"
        fill="#00d4ff" text-anchor="middle" font-weight="700">asyncio</text>

  <!-- Code lines -->
  <text x="84" y="698" font-family="'Courier New', monospace" font-size="13" fill="#7b61ff">import</text>
  <text x="148" y="698" font-family="'Courier New', monospace" font-size="13" fill="#ffffff" opacity="0.75">asyncio</text>

  <text x="84" y="722" font-family="'Courier New', monospace" font-size="13" fill="#7b61ff">async def</text>
  <text x="162" y="722" font-family="'Courier New', monospace" font-size="13" fill="#00d4ff">main</text>
  <text x="216" y="722" font-family="'Courier New', monospace" font-size="13" fill="#ffffff" opacity="0.65">():</text>

  <text x="104" y="744" font-family="'Courier New', monospace" font-size="13" fill="#ffffff" opacity="0.65">results =</text>
  <text x="192" y="744" font-family="'Courier New', monospace" font-size="13" fill="#7b61ff">await</text>
  <text x="238" y="744" font-family="'Courier New', monospace" font-size="13" fill="#00d4ff">asyncio.gather</text>
  <text x="392" y="744" font-family="'Courier New', monospace" font-size="13" fill="#ffffff" opacity="0.65">(</text>

  <text x="124" y="764" font-family="'Courier New', monospace" font-size="13" fill="#00d4ff">fetch</text>
  <text x="162" y="764" font-family="'Courier New', monospace" font-size="13" fill="#ffffff" opacity="0.65">(url1),</text>
  <text x="232" y="764" font-family="'Courier New', monospace" font-size="13" fill="#00d4ff">fetch</text>
  <text x="270" y="764" font-family="'Courier New', monospace" font-size="13" fill="#ffffff" opacity="0.65">(url2),</text>
  <text x="340" y="764" font-family="'Courier New', monospace" font-size="13" fill="#00d4ff">fetch</text>
  <text x="378" y="764" font-family="'Courier New', monospace" font-size="13" fill="#ffffff" opacity="0.65">(url3),</text>

  <text x="104" y="784" font-family="'Courier New', monospace" font-size="13" fill="#ffffff" opacity="0.65">)</text>

  <text x="84" y="808" font-family="'Courier New', monospace" font-size="13" fill="#00d4ff">asyncio.run</text>
  <text x="184" y="808" font-family="'Courier New', monospace" font-size="13" fill="#ffffff" opacity="0.65">(</text>
  <text x="194" y="808" font-family="'Courier New', monospace" font-size="13" fill="#00d4ff">main</text>
  <text x="232" y="808" font-family="'Courier New', monospace" font-size="13" fill="#ffffff" opacity="0.65">())</text>

  <!-- RIGHT code box — aiohttp -->
  <rect x="840" y="640" width="720" height="200" rx="12" fill="#060a14" opacity="0.88"/>
  <rect x="840" y="640" width="720" height="200" rx="12" fill="none" stroke="#00ffaa" stroke-width="1.5" opacity="0.4"/>

  <!-- Tab label -->
  <rect x="840" y="640" width="130" height="30" rx="8" fill="#00ffaa" opacity="0.18"/>
  <text x="905" y="660" font-family="'Courier New', monospace" font-size="12"
        fill="#00ffaa" text-anchor="middle" font-weight="700">aiohttp</text>

  <!-- Code lines -->
  <text x="864" y="698" font-family="'Courier New', monospace" font-size="13" fill="#7b61ff">import</text>
  <text x="928" y="698" font-family="'Courier New', monospace" font-size="13" fill="#ffffff" opacity="0.75">aiohttp</text>

  <text x="864" y="722" font-family="'Courier New', monospace" font-size="13" fill="#7b61ff">async def</text>
  <text x="942" y="722" font-family="'Courier New', monospace" font-size="13" fill="#00ffaa">fetch</text>
  <text x="984" y="722" font-family="'Courier New', monospace" font-size="13" fill="#ffffff" opacity="0.65">(url):</text>

  <text x="884" y="744" font-family="'Courier New', monospace" font-size="13" fill="#7b61ff">async with</text>
  <text x="972" y="744" font-family="'Courier New', monospace" font-size="13" fill="#00ffaa">aiohttp.ClientSession</text>
  <text x="1196" y="744" font-family="'Courier New', monospace" font-size="13" fill="#ffffff" opacity="0.65">() as s:</text>

  <text x="904" y="764" font-family="'Courier New', monospace" font-size="13" fill="#7b61ff">async with</text>
  <text x="992" y="764" font-family="'Courier New', monospace" font-size="13" fill="#00ffaa">s.get</text>
  <text x="1038" y="764" font-family="'Courier New', monospace" font-size="13" fill="#ffffff" opacity="0.65">(url) as resp:</text>

  <text x="924" y="784" font-family="'Courier New', monospace" font-size="13" fill="#7b61ff">return</text>
  <text x="977" y="784" font-family="'Courier New', monospace" font-size="13" fill="#7b61ff">await</text>
  <text x="1023" y="784" font-family="'Courier New', monospace" font-size="13" fill="#00ffaa">resp.text</text>
  <text x="1116" y="784" font-family="'Courier New', monospace" font-size="13" fill="#ffffff" opacity="0.65">()</text>

  <text x="864" y="820" font-family="'Courier New', monospace" font-size="11"
        fill="#444d66" opacity="0.75"># asyncio is the runtime underneath this ↑</text>

  <!-- ══════════════════════════════════════════════════════ -->
  <!--               BOTTOM TAGLINE                          -->
  <!-- ══════════════════════════════════════════════════════ -->
  <text x="800" y="870" font-family="'Courier New', monospace" font-size="14"
        fill="#ffffff" text-anchor="middle" opacity="0.18" letter-spacing="5">
    asyncio ORCHESTRATES WHEN · aiohttp HANDLES WHAT
  </text>
</svg>